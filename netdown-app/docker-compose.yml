services:
  mysql:
    image: mysql:8.0
    container_name: netdown-mysql
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: rootpassword
      MYSQL_DATABASE: netdown
      MYSQL_USER: netdownuser
      MYSQL_PASSWORD: netdownpass
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql

volumes:
  mysql_data:
